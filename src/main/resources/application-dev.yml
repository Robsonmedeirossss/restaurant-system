spring:
  application:
    name: restaurant
  datasource:
    url: jdbc:postgresql://localhost:5444/restaurant
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true
    locations: classpath:db/migration